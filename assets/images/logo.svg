<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Shubham Sah Productions">
  <defs>
    <linearGradient id="gold" x1="10" y1="8" x2="110" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#f0cc4a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <style>
      .lens {
        transform-origin: 60px 56px;
        animation: spin 14s linear infinite;
      }
      .letter {
        fill: none;
        stroke: url(#gold);
        stroke-width: 6.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .s1 { stroke-dasharray: 120; animation: write 5s ease-in-out infinite; }
      .s2 { stroke-dasharray: 120; animation: write 5s 0.22s ease-in-out infinite; }
      .p  { stroke-dasharray: 130; animation: write 5s 0.44s ease-in-out infinite; }
      .play {
        transform-origin: 91px 44px;
        animation: blink 1.6s ease-in-out infinite;
      }
      .ghost { fill: none; stroke: #f0cc4a; stroke-width: 6.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.28; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes write {
        0% { stroke-dashoffset: 130; }
        32%, 76% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -130; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .lens, .s1, .s2, .p, .play { animation: none; }
        .letter { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0b0a09" stroke="url(#gold)" stroke-width="2.5"/>
  <circle class="lens" cx="60" cy="56" r="46" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-dasharray="3 8" stroke-linecap="round"/>

  <!-- Ghost SSP so Shubham Sah Productions stays readable -->
  <g class="ghost">
    <path d="M18 38 C20 26 36 24 46 29 C56 34 54 46 42 51 C30 56 22 60 22 70 C22 82 38 88 52 82"/>
    <path d="M42 38 C44 26 60 24 70 29 C80 34 78 46 66 51 C54 56 46 60 46 70 C46 82 62 88 76 82"/>
    <path d="M78 34 L78 86 M78 34 L94 34 C104 34 108 46 98 52 C92 56 78 56 78 56"/>
  </g>

  <!-- S = Shubham -->
  <path class="letter s1" d="M18 38 C20 26 36 24 46 29 C56 34 54 46 42 51 C30 56 22 60 22 70 C22 82 38 88 52 82"/>
  <!-- S = Sah -->
  <path class="letter s2" d="M42 38 C44 26 60 24 70 29 C80 34 78 46 66 51 C54 56 46 60 46 70 C46 82 62 88 76 82"/>
  <!-- P = Productions, with a play mark in the bowl -->
  <path class="letter p" d="M78 34 L78 86 M78 34 L94 34 C104 34 108 46 98 52 C92 56 78 56 78 56"/>
  <polygon class="play" points="88,40 88,50 97,45" fill="#f0cc4a"/>
</svg>
