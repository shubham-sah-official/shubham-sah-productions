<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Shubham Sah Productions">
  <defs>
    <linearGradient id="gold" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="45%" stop-color="#f0cc4a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="goldFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="40%" stop-color="#fff4b8"/>
      <stop offset="70%" stop-color="#f0cc4a"/>
      <stop offset="100%" stop-color="#c9a227"/>
      <animate attributeName="x1" values="-80%;20%" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20%;120%" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .reel {
        transform-origin: 60px 60px;
        animation: spin 8s linear infinite;
      }
      .tick {
        transform-origin: 60px 60px;
        animation: spin 8s linear infinite reverse;
      }
      .ring {
        transform-origin: 60px 60px;
        animation: pulse 2.6s ease-in-out infinite;
      }
      .ss {
        fill: none;
        stroke: url(#goldFlow);
        stroke-width: 7.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 160;
        animation: draw 3.6s ease-in-out infinite;
      }
      .bar {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        fill: url(#gold);
      }
      .b1 { animation: eq 0.7s ease-in-out infinite; }
      .b2 { animation: eq 0.7s ease-in-out 0.12s infinite; }
      .b3 { animation: eq 0.7s ease-in-out 0.24s infinite; }
      .b4 { animation: eq 0.7s ease-in-out 0.08s infinite; }
      .b5 { animation: eq 0.7s ease-in-out 0.2s infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes draw {
        0% { stroke-dashoffset: 160; }
        45%, 70% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -160; }
      }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .reel, .tick, .ring, .ss, .b1, .b2, .b3, .b4, .b5 { animation: none; }
        .ss { stroke-dashoffset: 0; }
        .bar { transform: none; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0b0a09" stroke="url(#gold)" stroke-width="2.5"/>
  <circle class="ring" cx="60" cy="54" r="34" fill="none" stroke="#f0cc4a" stroke-width="0.8" opacity="0.45"/>

  <g class="reel" fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="5 8">
    <circle cx="60" cy="54" r="40"/>
  </g>
  <g class="tick" fill="#f0cc4a">
    <circle cx="60" cy="16" r="2"/>
    <circle cx="98" cy="54" r="2"/>
    <circle cx="60" cy="92" r="2"/>
    <circle cx="22" cy="54" r="2"/>
  </g>

  <path fill="none" stroke="#f0cc4a" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"
    d="M42 34
    C44 24 58 22 68 26
    C80 31 80 44 68 50
    C56 56 44 58 44 70
    C44 84 60 90 76 84"/>
  <path class="ss" d="M42 34
    C44 24 58 22 68 26
    C80 31 80 44 68 50
    C56 56 44 58 44 70
    C44 84 60 90 76 84"/>

  <g>
    <rect class="bar b1" x="40" y="96" width="5" height="12" rx="1.5"/>
    <rect class="bar b2" x="49" y="92" width="5" height="16" rx="1.5"/>
    <rect class="bar b3" x="58" y="88" width="5" height="20" rx="1.5"/>
    <rect class="bar b4" x="67" y="92" width="5" height="16" rx="1.5"/>
    <rect class="bar b5" x="76" y="96" width="5" height="12" rx="1.5"/>
  </g>
</svg>
