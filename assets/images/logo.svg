<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Shubham Sah Productions">
  <defs>
    <linearGradient id="royal" x1="18" y1="8" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="35%" stop-color="#E8C547"/>
      <stop offset="68%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#7A5910"/>
    </linearGradient>
    <linearGradient id="royalSoft" x1="30" y1="24" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7E7A1"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2a2214"/>
      <stop offset="70%" stop-color="#120e08"/>
      <stop offset="100%" stop-color="#070604"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .reel { transform-origin: 60px 60px; animation: spin 14s linear infinite; }
      .sprocket { transform-origin: 60px 60px; animation: spin 14s linear infinite reverse; }
      .iris { transform-origin: 60px 60px; animation: iris 3.6s ease-in-out infinite; }
      .pulse { transform-origin: 60px 60px; animation: pulse 3.6s ease-in-out infinite; }
      .shine {
        animation: sweep 4.8s ease-in-out infinite;
      }
      .letter {
        fill: none;
        stroke: url(#royal);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: draw 2.4s ease forwards;
      }
      .fill-ss { opacity: 0; animation: fadeIn 0.6s 1.6s ease forwards; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes iris {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(0.86); opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes sweep {
        0% { transform: translateX(-80px) rotate(18deg); opacity: 0; }
        18% { opacity: 0.7; }
        42% { opacity: 0; }
        100% { transform: translateX(90px) rotate(18deg); opacity: 0; }
      }
      @keyframes draw {
        from { stroke-dasharray: 180; stroke-dashoffset: 180; }
        to { stroke-dasharray: 180; stroke-dashoffset: 0; }
      }
      @keyframes fadeIn { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .reel, .sprocket, .iris, .pulse, .shine, .letter, .fill-ss { animation: none; }
        .fill-ss { opacity: 1; }
        .letter { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <circle cx="60" cy="60" r="57" fill="url(#disc)" stroke="url(#royal)" stroke-width="2.2"/>

  <g class="reel" filter="url(#glow)">
    <circle cx="60" cy="60" r="49" fill="none" stroke="url(#royal)" stroke-width="5" stroke-dasharray="6 7" stroke-linecap="round"/>
  </g>

  <g class="sprocket">
    <circle cx="60" cy="60" r="41" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.55"/>
    <circle cx="60" cy="18" r="2.1" fill="#f3e08a"/>
    <circle cx="60" cy="102" r="2.1" fill="#f3e08a"/>
    <circle cx="18" cy="60" r="2.1" fill="#f3e08a"/>
    <circle cx="102" cy="60" r="2.1" fill="#f3e08a"/>
    <circle cx="30.4" cy="30.4" r="2.1" fill="#c9a227"/>
    <circle cx="89.6" cy="30.4" r="2.1" fill="#c9a227"/>
    <circle cx="30.4" cy="89.6" r="2.1" fill="#c9a227"/>
    <circle cx="89.6" cy="89.6" r="2.1" fill="#c9a227"/>
  </g>

  <g class="iris">
    <polygon points="60,32 76,41 76,59 60,50" fill="#d4af37" opacity="0.18"/>
    <polygon points="76,41 92,50 84,66 68,57" fill="#c9a227" opacity="0.16"/>
    <polygon points="84,66 76,82 60,88 68,70" fill="#d4af37" opacity="0.18"/>
    <polygon points="60,88 44,82 36,66 52,70" fill="#c9a227" opacity="0.16"/>
    <polygon points="36,66 28,50 44,41 52,57" fill="#d4af37" opacity="0.18"/>
    <polygon points="44,41 60,32 68,50 52,50" fill="#c9a227" opacity="0.16"/>
  </g>

  <circle class="pulse" cx="60" cy="60" r="28" fill="none" stroke="url(#royalSoft)" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="24" fill="#0d0b07" stroke="#8c6914" stroke-width="0.6"/>

  <g transform="translate(60 62)">
    <text class="fill-ss" x="0" y="8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="url(#royal)" letter-spacing="-1">SS</text>
    <text class="letter" x="0" y="8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="none" letter-spacing="-1">SS</text>
  </g>

  <rect class="shine" x="8" y="-10" width="18" height="140" fill="#fff8d6" opacity="0" style="mix-blend-mode:screen"/>
</svg>
