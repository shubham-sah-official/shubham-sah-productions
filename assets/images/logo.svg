<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Shubham Sah Productions">
  <defs>
    <linearGradient id="gold" x1="16" y1="8" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#f0cc4a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .lens {
        transform-origin: 60px 58px;
        animation: spin 12s linear infinite;
      }
      .iris {
        transform-origin: 60px 58px;
        animation: focus 3.4s ease-in-out infinite;
      }
      .s1, .s2 {
        fill: none;
        stroke: url(#gold);
        stroke-width: 8.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#glow);
      }
      .s1 { animation: drawS 4.8s ease-in-out infinite; stroke-dasharray: 140; }
      .s2 { animation: drawS 4.8s 0.35s ease-in-out infinite; stroke-dasharray: 140; }
      .ghost { fill: none; stroke: #f0cc4a; stroke-width: 8.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.22; }
      .shine {
        animation: sweep 3.2s ease-in-out infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes focus {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(0.92); opacity: 1; }
      }
      @keyframes drawS {
        0% { stroke-dashoffset: 140; }
        35%, 78% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -140; }
      }
      @keyframes sweep {
        0% { transform: translateX(-70px); opacity: 0; }
        25% { opacity: 0.55; }
        55%, 100% { transform: translateX(80px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .lens, .iris, .s1, .s2, .shine { animation: none; }
        .s1, .s2 { stroke-dashoffset: 0; }
      }
    </style>
    <clipPath id="tile">
      <rect x="6" y="6" width="108" height="108" rx="28"/>
    </clipPath>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0b0a09" stroke="url(#gold)" stroke-width="2.6"/>

  <!-- Camera lens = cinematography / photography -->
  <g class="lens" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 7">
    <circle cx="60" cy="58" r="42"/>
  </g>
  <circle class="iris" cx="60" cy="58" r="36" fill="none" stroke="#f0cc4a" stroke-width="1"/>

  <!-- Ghost SS so initials stay readable while the gold stroke redraws -->
  <g class="ghost">
    <path d="M28 40 C30 26 50 24 64 30 C78 36 76 50 60 56 C44 62 32 66 32 78 C32 94 54 100 74 92"/>
    <path d="M46 40 C48 26 68 24 82 30 C96 36 94 50 78 56 C62 62 50 66 50 78 C50 94 72 100 92 92"/>
  </g>

  <!-- Interlocking SS = Shubham Sah -->
  <path class="s1" d="M28 40 C30 26 50 24 64 30 C78 36 76 50 60 56 C44 62 32 66 32 78 C32 94 54 100 74 92"/>
  <path class="s2" d="M46 40 C48 26 68 24 82 30 C96 36 94 50 78 56 C62 62 50 66 50 78 C50 94 72 100 92 92"/>

  <g clip-path="url(#tile)">
    <rect class="shine" x="8" y="-8" width="16" height="140" fill="#fff6c8" opacity="0" transform="rotate(18 60 60)"/>
  </g>
</svg>
